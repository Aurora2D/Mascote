<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gatinha da Erica</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,500&family=Nunito:wght@400;600;700&display=swap">
<style>
  /* Layout: palco de papel de aquarela no centro, gestos agrupados em fileiras de botões logo abaixo */
  :root {
    --bg: #f3eef4;
    --paper: #fbf8fb;
    --ink: #46394d;
    --muted: #84768b;
    --line: #ddd2e2;
    --accent: #b9799b;
    --chip: #ffffff;
    --chip-on: #ecdcea;
    --display: "Fraunces", Georgia, serif;
    --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #221d27; --paper: #2d2633; --ink: #efe6f2; --muted: #b0a2b8;
      --line: #43394b; --accent: #e0a6c4; --chip: #352d3c; --chip-on: #4a3c52; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #221d27; --paper: #2d2633; --ink: #efe6f2; --muted: #b0a2b8;
    --line: #43394b; --accent: #e0a6c4; --chip: #352d3c; --chip-on: #4a3c52; color-scheme: dark;
  }
  * { box-sizing: border-box }
  body {
    background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  main { max-width: 560px; margin: 0 auto; padding-block: 28px 40px; display: grid; gap: 22px; justify-items: center; text-align: center }
  h1 { font: italic 500 clamp(28px, 6vw, 38px)/1.1 var(--display); margin: 0; text-wrap: balance; letter-spacing: -0.01em }
  .sub { margin: 6px 0 0; color: var(--muted) }
  .stage {
    width: 100%; max-width: 420px; border-radius: 32px; background: var(--paper);
    border: 1px solid var(--line); padding-block: 12px; padding-inline: 28px;
  }
  gatinha-fantoche { width: 100%; max-width: 100% }
  .group { display: grid; gap: 10px; width: 100% }
  .label { font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted) }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center }
  button {
    font: 600 15px var(--body); color: var(--ink); background: var(--chip);
    border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; cursor: pointer;
    transition: background .15s, transform .1s;
  }
  button:hover, button[aria-pressed="true"] { background: var(--chip-on) }
  button:active { transform: scale(.96) }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
  .note { font-size: 13px; color: var(--muted); max-width: 46ch }
  @media (prefers-reduced-motion: reduce) { button { transition: none } }
</style>
</head>
<body>

<main>
  <header>
    <h1>Gatinha da Erica</h1>
    <p class="sub">Escolha uma pose e toque num gesto pra ver ela reagir.</p>
  </header>

  <div class="stage"><gatinha-fantoche id="cat"></gatinha-fantoche></div>

  <section class="group" aria-label="Poses">
    <span class="label">Poses</span>
    <div class="chips">
      <button data-pose="sentada" aria-pressed="true">Sentada</button>
      <button data-pose="escrita" aria-pressed="false">Escrevendo</button>
      <button data-pose="permissao" aria-pressed="false">Permissão</button>
      <button data-pose="comemoracao" aria-pressed="false">Comemoração</button>
    </div>
  </section>

  <section class="group" aria-label="Expressões">
    <span class="label">Expressões</span>
    <div class="chips">
      <button data-a="feliz">Feliz</button>
      <button data-a="curiosa">Curiosa</button>
      <button data-a="brilho">Clareza</button>
      <button data-a="vergonha">Vergonha</button>
      <button data-a="suspirar">Suspirar</button>
      <button data-a="piscar">Piscar</button>
    </div>
  </section>

  <section class="group" aria-label="Gestos">
    <span class="label">Gestos</span>
    <div class="chips">
      <button data-a="tchau">Dar tchau</button>
      <button data-a="sim">Dizer sim</button>
      <button data-a="nao">Dizer não</button>
      <button data-a="pular">Pular</button>
      <button data-a="comemorar">Comemorar</button>
      <button data-a="abanar">Abanar o rabo</button>
      <button data-a="orelhas">Mexer orelha</button>
      <button data-a="escrever">Escrever</button>
    </div>
  </section>

  <p class="note">Mesmo parada, ela respira, mexe a cabeça, balança o rabo e pisca sozinha.</p>
</main>

<script src="fantoche-assets.js"></script>
<script src="fantoche.js"></script>
<script>
  const cat = document.getElementById('cat');
  document.querySelectorAll('[data-a]').forEach(b => b.addEventListener('click', () => cat.play(b.dataset.a)));
  const poseBtns = document.querySelectorAll('[data-pose]');
  poseBtns.forEach(b => b.addEventListener('click', () => {
    cat.setPose(b.dataset.pose);
    poseBtns.forEach(x => x.setAttribute('aria-pressed', x === b));
  }));
</script>
</body>
</html>
