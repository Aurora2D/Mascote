<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gatinha — mascote</title>
<style>
  :root{--bg:#f6f1ee;--ink:#4a3f4e;--muted:#837689;--card:#ece5ef;--line:#d9cfe0;--btn:#fff;--hover:#efe4f1;--on:#cdb6d9}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;display:grid;min-height:100vh;place-items:center}
  main{text-align:center;padding:24px 16px;width:min(100%,780px)}
  h1{font-size:24px;margin:0 0 4px;font-weight:650}
  p{color:var(--muted);margin:0}
  .stage{border-radius:28px;background:var(--card);margin:20px auto;width:min(100%,440px);display:grid;place-items:center;padding:8px 24px;transition:background .3s}
  .stage.dark{background:#2b2733}.stage.white{background:#fff}
  gatinha-mascote{width:100%;max-width:360px}
  h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px;font-weight:600}
  nav{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
  button{font:inherit;color:inherit;background:var(--btn);border:1px solid var(--line);padding:9px 14px;border-radius:30px;cursor:pointer;transition:background .15s}
  button:hover{background:var(--hover)}
  button[aria-pressed=true]{background:var(--on);border-color:var(--on)}
  small{display:block;margin-top:22px;color:var(--muted)}
</style>
</head>
<body>
<main>
  <h1>Uma pequena companhia.</h1>
  <p>Tricolor, curiosa e cheia de gestos.</p>
  <div class="stage"><gatinha-mascote id="cat" pose="clareza"></gatinha-mascote></div>

  <h2>Poses</h2>
  <nav id="poses"></nav>
  <h2>Ações</h2>
  <nav id="actions">
    <button data-a="piscar">Piscar</button>
    <button data-a="curiosa">Curiosa</button>
    <button data-a="inclinar">Inclinar</button>
    <button data-a="acenar">Dizer sim</button>
    <button data-a="suspirar">Suspirar</button>
    <button data-a="abanar">Abanar o rabo</button>
    <button data-a="pular">Pular</button>
    <button data-a="tchau">Dar tchau</button>
    <button data-a="escrever">Escrever</button>
    <button data-a="tremer">Tremer</button>
  </nav>
  <p style="margin-top:18px"><button id="bg">Alternar fundo da prévia</button> <a href="fantoche/index.html"><button>Ver versão fantoche (peças)</button></a></p>
  <small>WebGL · aquarela original deformada por malha · sem bibliotecas</small>
</main>

<script src="mascote-assets.js"></script>
<script src="mascote.js"></script>
<script>
  const cat = document.getElementById('cat');
  const poses = document.getElementById('poses');
  const RIG = customElements.get('gatinha-mascote').RIG;
  Object.entries(RIG).forEach(([id, r], i) => {
    const b = document.createElement('button');
    b.textContent = (i + 1) + '. ' + r.label;
    b.dataset.pose = id;
    b.onclick = () => cat.setPose(id);
    poses.append(b);
  });
  const mark = () => poses.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.pose === cat.poseName));
  cat.addEventListener('pose', mark); cat.addEventListener('ready', mark); mark();
  document.querySelectorAll('[data-a]').forEach(b => b.onclick = () => cat.play(b.dataset.a));
  let bg = 0;
  document.getElementById('bg').onclick = () => document.querySelector('.stage').className = 'stage ' + ['', 'dark', 'white'][++bg % 3];
</script>
</body>
</html>
